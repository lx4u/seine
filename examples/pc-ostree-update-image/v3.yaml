# Version 3 overlay for pc-ostree-update-image: adds chrony, and
# generates static deltas from versions 1 and 2.
#   seine build examples/pc-ostree-update-image/main.yaml examples/pc-ostree-update-image/v3.yaml

image:
    ostree:
        version: "3"
        payload:
            deltas-from: ["1", "2"]

playbook:
    - name: v3 packages
      wave: packages
      after: [base]
      tasks:
          - name: install chrony
            apt:
                name:
                    - chrony
                state: present
          - name: write image version to /etc/issue
            copy:
                dest: /etc/issue
                content: |
                    Debian GNU/Linux v3 \n \l
