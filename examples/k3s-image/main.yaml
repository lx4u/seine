requires:
    - ../common/amd64
    - ../common/bookworm
    - ../common/conf-accounts
    - ../common/conf-locales
    - ../common/conf-sysctl
    - ../common/conf-timezone
    - ../common/networkd
    - ../common/pc-image
    - package
    - test-boot

playbook:
    - name: Install K3s control-plane
      tasks:
          - name: Set KUBECONFIG in environment and profile
            copy:
                dest: "{{ item.dest }}"
                content: "{{ item.content }}"
                mode: '0644'
            loop:
                - dest: /etc/profile.d/k3s.sh
                  content: |
                      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                - dest: /etc/environment
                  content: |
                      KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          - name: Install K3s (built from source, see package.yaml)
            apt:
                state: present
                name:
                    - k3s
                    - cni-plugin

          - name: Disable standalone containerd service (k3s manages its own instance)
            systemd:
                name: containerd
                enabled: false
                masked: true

          - name: Ensure /opt/cni/bin directory exists
            file:
                path: /opt/cni/bin
                state: directory
                mode: '0755'

          - name: Symlink CNI plugins to PATH and /opt/cni/bin
            shell: |
                for bin in /usr/lib/cni/*; do
                    if [ -f "$bin" ]; then
                        ln -sf "$bin" /opt/cni/bin/$(basename "$bin")
                        ln -sf "$bin" /usr/bin/$(basename "$bin")
                    fi
                done
                if [ -f /usr/bin/flannel ]; then
                    ln -sf /usr/bin/flannel /opt/cni/bin/flannel
                    ln -sf /usr/bin/flannel /usr/lib/cni/flannel
                fi

          - name: Configure crictl for K3s containerd
            copy:
                dest: /etc/crictl.yaml
                content: |
                    runtime-endpoint: unix:///run/k3s/containerd/containerd.sock
                    image-endpoint: unix:///run/k3s/containerd/containerd.sock
                    timeout: 10
                    debug: false

containers:
    target: containerd
    namespace: k8s.io
    root: /var/lib/rancher/k3s/agent/containerd

