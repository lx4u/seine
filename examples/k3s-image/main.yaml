requires:
    - ../common/amd64
    - ../common/bookworm
    - ../common/conf-accounts
    - ../common/conf-locales
    - ../common/conf-sysctl
    - ../common/conf-timezone
    - ../common/networkd
    - ../common/pc-image
    - test-boot

playbook:
    - name: Install K3s control-plane
      tasks:
          - name: Install dependencies
            apt:
                state: present
                name:
                    - curl
                    - ca-certificates
                    - iptables
                    - iproute2

          - name: Set KUBECONFIG in environment and profile
            copy:
                dest: "{{ item.dest }}"
                content: "{{ item.content }}"
                mode: '0644'
            loop:
                - dest: /etc/profile.d/k3s.sh
                  content: |
                      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                - dest: /etc/environment
                  content: |
                      KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          - name: Download K3s binary
            get_url:
                url: https://github.com/k3s-io/k3s/releases/download/v1.30.4+k3s1/k3s[[ "-arm64" if distribution.architecture == "arm64" else "" ]]
                dest: /usr/local/bin/k3s
                mode: '0755'

          - name: Create K3s CLI symlinks
            file:
                src: /usr/local/bin/k3s
                dest: "/usr/local/bin/{{ item }}"
                state: link
            loop:
                - kubectl
                - crictl
                - ctr

          - name: Configure crictl for K3s containerd
            copy:
                dest: /etc/crictl.yaml
                content: |
                    runtime-endpoint: unix:///run/k3s/containerd/containerd.sock
                    image-endpoint: unix:///run/k3s/containerd/containerd.sock
                    timeout: 10
                    debug: false

          - name: Create K3s systemd service
            copy:
                dest: /etc/systemd/system/k3s.service
                content: |
                    [Unit]
                    Description=Lightweight Kubernetes
                    Documentation=https://k3s.io
                    After=network-online.target firewalld.service
                    Wants=network-online.target

                    [Service]
                    Type=notify
                    EnvironmentFile=-/etc/default/%N
                    EnvironmentFile=-/etc/sysconfig/%N
                    EnvironmentFile=-/etc/systemd/system/%N.env
                    KillMode=process
                    Delegate=yes
                    LimitNOFILE=1048576
                    LimitNPROC=infinity
                    LimitCORE=infinity
                    TasksMax=infinity
                    TimeoutStartSec=0
                    Restart=always
                    RestartSec=5s
                    ExecStartPre=-/sbin/modprobe br_netfilter
                    ExecStartPre=-/sbin/modprobe overlay
                    ExecStart=/usr/local/bin/k3s server

                    [Install]
                    WantedBy=multi-user.target

          - name: Enable K3s service
            systemd:
                name: k3s
                enabled: true

containers:
    target: containerd
    namespace: k8s.io
    root: /var/lib/rancher/k3s/agent/containerd

