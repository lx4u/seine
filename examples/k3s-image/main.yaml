requires:
    - stdlib:debian/amd64.yml
    - stdlib:debian/bookworm.yml
    - ../common/conf-accounts
    - stdlib:debian/locales.yml
    - stdlib:debian/sysctl.yml
    - stdlib:debian/timezone.yml
    - stdlib:services/networkd.yml
    - ../common/pc-image
    - package
    - test-boot

playbook:
    - name: Install K3s control-plane
      tasks:
          - name: Set KUBECONFIG in environment and profile
            copy:
                dest: "{{ item.dest }}"
                content: "{{ item.content }}"
                mode: '0644'
            loop:
                - dest: /etc/profile.d/k3s.sh
                  content: |
                      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                - dest: /etc/environment
                  content: |
                      KUBECONFIG=/etc/rancher/k3s/k3s.yaml

          - name: Install K3s (built from source, see package.yaml)
            apt:
                state: present
                name: k3s

          - name: Install sysctl, which the kernel parameters task runs
            apt:
                state: present
                name: procps

          - name: Configure crictl for K3s containerd
            copy:
                dest: /etc/crictl.yaml
                content: |
                    runtime-endpoint: unix:///run/k3s/containerd/containerd.sock
                    image-endpoint: unix:///run/k3s/containerd/containerd.sock
                    timeout: 10
                    debug: false

containers:
    target: containerd
    namespace: k8s.io
    root: /var/lib/rancher/k3s/agent/containerd

    images:
