# SPDX-License-Identifier Apache-2.0

# ./seine.py build examples/minimal-initrd/main.yaml
# ./seine.py build --packages-only examples/minimal-uki/main.yaml
#
# Wraps the distribution's own amd64 kernel and the initrd
# examples/minimal-initrd/ deploys into one Unified Kernel Image, via
# ukify. Needs the initrd built first: 'extends: uki: initrd:' names a
# deployed 'initrd:' artifact, not one this spec builds.
#
# 'root=gpt-auto' rather than a PARTUUID: examples/minimal-initrd/'s
# dracut-built initrd runs systemd's gpt-auto-generator, which finds the
# root partition by its Discoverable Partition Specification GPT type
# GUID (Imager._dps_gpt_type()) instead of needing one baked into the
# cmdline.
#
# UKI and addon share one vault key, 'uefi-secureboot' -- the same
# key examples/pc-uki-image's own disk signs with, defined once in
# examples/common/dev-secureboot-key.yaml.

requires:
    - ../common/amd64
    - ../common/trixie
    - ../common/dev-secureboot-key

packages:
    - name: linux-uki-amd64
      version: "1"
      extends:
          uki:
              tool: ukify
              linux-image: linux-image-amd64
              initrd: minimal.img
              cmdline: "console=ttyS0 root=gpt-auto ro"
              signing-key: vault:uefi-secureboot

    # A systemd-stub cmdline addon, installed alongside the UKI at
    # boot/EFI/Linux/linux-uki-amd64.efi.extra.d/ -- silences kernel
    # boot output without rebuilding the UKI itself. No 'signing-key'
    # of its own: it inherits the UKI's, above.
    - name: linux-uki-amd64-quiet
      version: "1"
      extends:
          uki-addon:
              uki: linux-uki-amd64
              cmdline: "quiet loglevel=0"
