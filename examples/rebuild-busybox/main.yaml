# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier: Apache-2.0

# 'conf-accounts' sets a root password -- so this image can actually be
# logged into and tested (busybox.yaml's own 'test:' section does,
# using the 'Log In' keyword conf-accounts.yaml defines beside the
# password it sets).
requires:
    - stdlib:debian/amd64.yml
    - stdlib:debian/bookworm.yml
    - ../common/pc-image
    - ../common/conf-accounts
    - busybox

playbook:
    - name: install the rebuilt busybox
      wave: packages
      before: [kernel]
