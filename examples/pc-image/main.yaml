requires:
    - stdlib:debian/amd64.yml
    - stdlib:debian/bookworm.yml
    - ../common/conf-accounts
    - stdlib:debian/locales.yml
    - stdlib:debian/sysctl.yml
    - stdlib:debian/timezone.yml
    - stdlib:services/sshd.yml
    - ../common/pc-image
    - french
    - selinux
    - test-boot

playbook:
    - name: some great packages
      priority: 250
      tasks:
           - name: install utilities
             apt:
                 state: present
                 name:
                     - iputils-ping
           - name: install vim
             apt:
                 state: present
                 name:
                     - vim
