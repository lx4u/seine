# seine - Slim Embedded Images Now Easy
# SPDX-License-Identifier Apache-2.0

# The 'main' operating system of examples/main-recovery-image/'s two --
# see disk.yaml. Also buildable standalone: 'seine build main.yaml'
# produces main.tar, the same rootfs disk.yaml pulls in as 'main'.
# Installs grub and a kernel since 'main' owns the boot here.
requires:
    - stdlib:debian/amd64.yml
    - stdlib:debian/trixie.yml
    - ../common/conf-accounts
    - stdlib:debian/locales.yml
    - stdlib:debian/timezone.yml
    - stdlib:services/sshd.yml
    - ../pc-image/grub-serial-console

playbook:
    - name: everyday packages
      wave: packages
      after: [base]
      before: [kernel]
      tasks:
          - name: install a small toolset
            apt:
                state: present
                name:
                    - vim
                    - iputils-ping
