# Turns signed composefs on. ostree-prepare-root reads this file and the
# public key from the initramfs, so they are written before the kernel
# installs and dracut builds the initramfs. The build stops before any
# disk work if they are missing (docs/ostree.md).

playbook:
    - name: enable signed composefs
      wave: initramfs
      after: [base]
      before: [kernel]
      tasks:
          - name: make room for it
            file:
                path: /usr/lib/ostree
                state: directory
          - name: write prepare-root.conf
            copy:
                dest: /usr/lib/ostree/prepare-root.conf
                content: |
                    [composefs]
                    enabled = signed
          - name: make room for the key
            file:
                path: /etc/ostree
                state: directory
          - name: write the key the boot trusts
            copy:
                dest: /etc/ostree/initramfs-root-binding.key
                content: "[[ vault_ed25519_public('composefs-commits') ]]\n"
