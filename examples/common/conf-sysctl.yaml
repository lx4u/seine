playbook:
    - name: tune kernel parameters
      wave: config
      after: [kernel]
      tasks:
        - name: install the sysctl tool the module needs
          apt:
              state: present
              name:
                  - procps

        # the build container has no write access to /proc/sys, so this
        # only writes the config file for the booted target to apply
        - name: lower swappiness for an appliance workload
          ansible.posix.sysctl:
              name: vm.swappiness
              value: "10"
              sysctl_set: false
              reload: false
