# seine-server configuration. Readable by root and the seine user only.
# Environment variables (see /etc/default/seine-server) override these keys.

# Required: pre-shared token workers use to enroll. Generate one with:
#   openssl rand -hex 32
#enrollment_token:

db_path: /var/lib/seine/seine.db

